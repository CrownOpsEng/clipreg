# ClipReg COSMIC shortcut map.
#
# Each binding maps an arbitrary register name to up to three independent
# actions. Remove an action table to disable only that action. The key and
# modifier list can differ per action.
#
# Allowed modifiers: Super, Ctrl, Shift, Alt.
# Register names: A-Z/a-z/0-9 plus . _ - (max 32 chars).
version = 1

[[binding]]
set = "digits"
register = "1"
enabled = true
grab = { key = "1", modifiers = ["Super", "Shift"] }
save = { key = "1", modifiers = ["Super", "Ctrl", "Shift"] }
paste = { key = "1", modifiers = ["Ctrl", "Shift"] }

