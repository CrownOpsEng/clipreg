# ClipReg application accelerator overrides.
# First matching line wins. Matching is case-insensitive shell globbing.
#
# pattern|copy_fallback|paste_fallback|grab_strategy
#
# grab_strategy:
#   copy          safe Ctrl+Insert probe, then copy_fallback
#   primary-first use a primary selection proven to belong to this focus epoch,
#                 otherwise safe copy probe + copy_fallback
#   primary-only  require an affine primary selection; never inject Copy
#
# Use "-" to disable an unsafe/unknown app-specific fallback. Grab uses the
# safe Ctrl+Insert probe first and may then use copy_fallback. Paste is different:
# ClipReg injects exactly ONE accelerator so it can never double-paste. A "-"
# paste profile selects safe_paste_chord (normally Shift+Insert) when primary
# staging is available. Unknown applications never receive an unclassified Ctrl+C.

*CosmicTerm*|CTRL+SHIFT+C|CTRL+SHIFT+V|primary-first
*cosmicterm*|CTRL+SHIFT+C|CTRL+SHIFT+V|primary-first
*org.gnome.Terminal*|CTRL+SHIFT+C|CTRL+SHIFT+V|primary-first
*gnome-terminal*|CTRL+SHIFT+C|CTRL+SHIFT+V|primary-first
*terminal*|CTRL+SHIFT+C|CTRL+SHIFT+V|primary-first
*konsole*|CTRL+SHIFT+C|CTRL+SHIFT+V|primary-first
*alacritty*|CTRL+SHIFT+C|CTRL+SHIFT+V|primary-first
*kitty*|CTRL+SHIFT+C|CTRL+SHIFT+V|primary-first
*wezterm*|CTRL+SHIFT+C|CTRL+SHIFT+V|primary-first
*foot*|CTRL+SHIFT+C|CTRL+SHIFT+V|primary-first
*xterm*|-|SHIFT+INSERT|primary-only

# Apps with embedded terminals: do not fall back to Ctrl+C for Copy.
*code*|CTRL+INSERT|SHIFT+INSERT|copy
*codium*|CTRL+INSERT|SHIFT+INSERT|copy
*jetbrains*|CTRL+INSERT|SHIFT+INSERT|copy
*idea*|CTRL+INSERT|SHIFT+INSERT|copy
*pycharm*|CTRL+INSERT|SHIFT+INSERT|copy
*clion*|CTRL+INSERT|SHIFT+INSERT|copy
*goland*|CTRL+INSERT|SHIFT+INSERT|copy
*webstorm*|CTRL+INSERT|SHIFT+INSERT|copy
*zed*|CTRL+INSERT|SHIFT+INSERT|copy

# Common GUI applications where Ctrl+C/Ctrl+V are known-safe fallbacks.
*firefox*|CTRL+C|CTRL+V|copy
*chromium*|CTRL+C|CTRL+V|copy
*chrome*|CTRL+C|CTRL+V|copy
*brave*|CTRL+C|CTRL+V|copy
*libreoffice*|CTRL+C|CTRL+V|copy
*cosmicfiles*|CTRL+C|CTRL+V|copy
*CosmicFiles*|CTRL+C|CTRL+V|copy
*nautilus*|CTRL+C|CTRL+V|copy
*thunar*|CTRL+C|CTRL+V|copy
*dolphin*|CTRL+C|CTRL+V|copy

# Unknown app: safe probes only. Add an explicit profile if its accelerator is
# nonstandard rather than weakening this fail-closed default.
*|-|-|copy
