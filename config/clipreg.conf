# ClipReg transactional engine defaults.
# Clipboard synchronization is event-driven. These are failure bounds and the
# one physical-hotkey release grace period, not clipboard "sleep and hope" delays.
hotkey_release_ms=180
safe_probe_timeout_ms=350
copy_timeout_ms=1800
paste_timeout_ms=1800
transfer_timeout_ms=3000
request_quiet_ms=120
max_payload_mib=256

# Temporarily suspend CopyQ history capture around internal clipboard swaps.
suppress_copyq=true

# Stage a pasted register into primary selection as well as the clipboard so
# Shift+Insert can be selected as a single context-neutral paste accelerator for
# unknown/embedded-terminal applications. ClipReg never retries Paste with a
# second accelerator.
stage_primary_for_paste=true

# Safe Copy probe and context-neutral Paste chord. Application-specific
# accelerators live in app-profiles.conf.
safe_copy_chord=CTRL+INSERT
safe_paste_chord=SHIFT+INSERT
